<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 120" width="650" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap');
      .logo-text {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Times New Roman', serif;
        font-size: 45px;
        font-weight: 500;
        fill: #FFFFFF;
        letter-spacing: 0.08em;
      }
      .line-art {
        stroke: #FFFFFF;
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>
  <!-- Left Text -->
  <text x="15" y="74" class="logo-text">SCIENCE</text>
  <!-- Continuous Horizontal Connecting Line -->
  <!-- Starts from the middle bar of 'E' in SCIENCE and crosses through 'O' in OF -->
  <line x1="245" y1="58" x2="385" y2="58" class="line-art" />
  <!-- Ribbon Bow (Positioned perfectly on the line) -->
  <g>
    <!-- Left bow loop -->
    <path d="M 315,58 C 298,46 290,52 294,58 C 290,64 298,70 315,58 Z" class="line-art" />
    <!-- Right bow loop -->
    <path d="M 315,58 C 332,46 340,52 336,58 C 340,64 332,70 315,58 Z" class="line-art" />
    <!-- Ribbon tails -->
    <path d="M 314,59 C 309,69 303,75 296,78" class="line-art" />
    <path d="M 316,59 C 321,69 327,75 334,78" class="line-art" />
  </g>
  <!-- Right Text -->
  <text x="355" y="74" class="logo-text">OF GIFTS</text>
</svg>
