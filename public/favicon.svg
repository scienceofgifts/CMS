<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#E5B242" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3444" />
      <stop offset="100%" stop-color="#1C222E" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5B242" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#9CA3AF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E5B242" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Gift Box Body -->
  <rect x="17" y="31" width="30" height="21" rx="2.5" fill="url(#boxGrad)" stroke="#4A5568" stroke-width="1" />
  
  <!-- Horizontal Ribbon on Body -->
  <rect x="17" y="38" width="30" height="5" fill="url(#goldGrad)" />

  <!-- Gift Box Lid -->
  <rect x="14" y="24" width="36" height="8" rx="2" fill="url(#boxGrad)" stroke="#4A5568" stroke-width="1" />

  <!-- Vertical Ribbon through Lid and Body -->
  <rect x="29.5" y="24" width="5" height="28" fill="url(#goldGrad)" />

  <!-- Top Ribbon Bow Left Loop -->
  <path d="M 32,24.5 C 24.5,13.5 17,17 21.5,22.5 C 23.5,25 28,25 32,24.5 Z" fill="url(#goldGrad)" stroke="#9A7013" stroke-width="0.6" />
  
  <!-- Top Ribbon Bow Right Loop -->
  <path d="M 32,24.5 C 39.5,13.5 47,17 42.5,22.5 C 40.5,25 36,25 32,24.5 Z" fill="url(#goldGrad)" stroke="#9A7013" stroke-width="0.6" />

  <!-- Center Knot -->
  <ellipse cx="32" cy="24" rx="2.8" ry="2.2" fill="#FFF1B8" stroke="#9A7013" stroke-width="0.6" />

  <!-- Ribbon Tails -->
  <path d="M 31,25 C 27,28.5 24.5,31.5 23.5,34" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 33,25 C 37,28.5 39.5,31.5 40.5,34" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Sparkle Accent (Science discovery star) -->
  <path d="M 49,13 L 50.1,16.2 L 53.3,17.3 L 50.1,18.4 L 49,21.6 L 47.9,18.4 L 44.7,17.3 L 47.9,16.2 Z" fill="#FDE68A" opacity="0.9" />
</svg>